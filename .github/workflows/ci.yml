name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Format + Clippy + Test + Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@96d8491b80fc26e2ab48ff0c3928c002176297c8 # 1.93.1
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        run: cargo audit --deny unsound

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependency policy
        run: cargo deny check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run all tests and targets
        run: cargo test --locked --workspace --all-targets

      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.4 --locked

      - name: Generate required coverage reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo llvm-cov --locked --workspace --all-targets --lcov --output-path coverage/lcov.info
          cargo llvm-cov --locked report --text > coverage/summary.txt
          test -s coverage/lcov.info
          test -s coverage/summary.txt

      - name: Enforce coverage floor
        run: python3 scripts/check_coverage.py

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: error
          retention-days: 30

      - name: Build release binaries
        run: cargo build --locked --workspace --release

      - name: Run production health check
        run: target/release/qxfx0 --db "$RUNNER_TEMP/qxfx0-doctor.db" doctor

      - name: Run cadence smoke soak
        env:
          QXFX0_BIN: ${{ github.workspace }}/target/release/qxfx0
          QXFX0_DIAGNOSTIC_DIR: ${{ runner.temp }}/qxfx0-cadence-smoke
          QXFX0_DIAGNOSTIC_TURNS: "30"
          QXFX0_DIAGNOSTIC_INTERVAL_SECONDS: "0"
          QXFX0_MAX_RESPONSE_MS: "2000"
        run: bash scripts/diagnostic-soak-1000.sh

      - name: Verify committed census matches the binary
        run: python3 scripts/generate_census.py --check --binary target/release/qxfx0

      - name: Run ResponsePlan V2 contract gates
        shell: bash
        run: |
          set -euo pipefail
          for gate in \
            response-plan-v2-phase-a \
            response-plan-v2-phase-b \
            response-plan-v2-phase-c \
            response-plan-v2-replay \
            response-plan-v2-zero-downgrade \
            response-plan-v2-canary-report; do
            target/release/qxfx0 doctor --gate "$gate"
          done

      - name: Verify explicit canary authority CLI path
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/qxfx0-authority-trace.jsonl"
          target/release/qxfx0 \
            --db "$RUNNER_TEMP/qxfx0-authority.db" \
            turn "что такое свобода?" \
            --response-plan-v2-authority \
            --response-plan-v2-trace-jsonl "$trace"
          test -s "$trace"
          target/release/qxfx0 verify-authority-trace "$trace" > "$RUNNER_TEMP/qxfx0-authority-verification.json"
          target/release/qxfx0 authority-report "$trace" > "$RUNNER_TEMP/qxfx0-authority-report.json"

      - name: Export ResponsePlan V2 gate reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qxfx0-v2-gates"
          for gate in \
            response-plan-v2-phase-a \
            response-plan-v2-phase-b \
            response-plan-v2-phase-c \
            response-plan-v2-replay \
            response-plan-v2-zero-downgrade \
            response-plan-v2-canary-report; do
            target/release/qxfx0 doctor --gate "$gate" --json > "$RUNNER_TEMP/qxfx0-v2-gates/$gate.json"
          done

      - name: Run behavioral authority matrix
        run: bash scripts/response-plan-v2-behavioral-canary.sh target/release/qxfx0 "$RUNNER_TEMP/qxfx0-v2-behavioral"

      - name: Export release metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg version "$(target/release/qxfx0 version)" \
            '{schema:"qxfx0.release-metadata.v1",commit:$commit,ref:$ref,run_id:$run_id,version:$version}' \
            > "$RUNNER_TEMP/qxfx0-release-metadata.json"

      - name: Upload ResponsePlan V2 operational evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: response-plan-v2-operational-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qxfx0-authority-trace.jsonl
            ${{ runner.temp }}/qxfx0-authority-verification.json
            ${{ runner.temp }}/qxfx0-authority-report.json
            ${{ runner.temp }}/qxfx0-release-metadata.json
            ${{ runner.temp }}/qxfx0-v2-gates/*.json
            ${{ runner.temp }}/qxfx0-v2-behavioral/**/*.jsonl
            ${{ runner.temp }}/qxfx0-v2-behavioral/*-report.json
          if-no-files-found: error
          retention-days: 90
