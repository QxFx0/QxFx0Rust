name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Format + Clippy + Test + Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run all tests and targets
        run: cargo test --workspace --all-targets

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Run production health check
        run: target/release/qxfx0 --db "$RUNNER_TEMP/qxfx0-doctor.db" doctor

      - name: Run ResponsePlan V2 contract gates
        shell: bash
        run: |
          set -euo pipefail
          for gate in \
            response-plan-v2-phase-a \
            response-plan-v2-phase-b \
            response-plan-v2-phase-c \
            response-plan-v2-replay \
            response-plan-v2-zero-downgrade \
            response-plan-v2-canary-report; do
            target/release/qxfx0 doctor --gate "$gate"
          done

      - name: Verify explicit canary authority CLI path
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/qxfx0-authority-trace.jsonl"
          target/release/qxfx0 \
            --db "$RUNNER_TEMP/qxfx0-authority.db" \
            turn "что такое свобода?" \
            --response-plan-v2-authority \
            --response-plan-v2-trace-jsonl "$trace"
          test -s "$trace"
          target/release/qxfx0 verify-authority-trace "$trace" > "$RUNNER_TEMP/qxfx0-authority-verification.json"
          target/release/qxfx0 authority-report "$trace" > "$RUNNER_TEMP/qxfx0-authority-report.json"

      - name: Export ResponsePlan V2 gate reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qxfx0-v2-gates"
          for gate in \
            response-plan-v2-phase-a \
            response-plan-v2-phase-b \
            response-plan-v2-phase-c \
            response-plan-v2-replay \
            response-plan-v2-zero-downgrade \
            response-plan-v2-canary-report; do
            target/release/qxfx0 doctor --gate "$gate" --json > "$RUNNER_TEMP/qxfx0-v2-gates/$gate.json"
          done

      - name: Run behavioral authority matrix
        run: bash scripts/response-plan-v2-behavioral-canary.sh target/release/qxfx0 "$RUNNER_TEMP/qxfx0-v2-behavioral"

      - name: Validate topic corpus expansion framework
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools/test_topic_corpus_pipeline.py
          python3 tools/topic_corpus_pipeline.py inventory --output "$RUNNER_TEMP/topic-maturity.json"
          python3 tools/topic_corpus_pipeline.py compile \
            data/corpus-batches/2026-08-audited-clusters-v1.json \
            --output "$RUNNER_TEMP/topic-corpus-batch.json"
          jq -e '
            .schema == "qxfx0.topic-corpus-compiled.v1" and
            .status == "proposal_only" and
            .authority_change == "none" and
            .topics_total == 10 and .claims_total == 25
          ' "$RUNNER_TEMP/topic-corpus-batch.json" >/dev/null
          jq -e '
            .totals.recognized == 107 and
            .totals.grounded == 30 and
            .totals.audited == 30 and
            .totals.canary == 6 and
            .totals.production_stable == 6
          ' "$RUNNER_TEMP/topic-maturity.json" >/dev/null
          test \
            "$(jq -r .manifest_digest "$RUNNER_TEMP/topic-corpus-batch.json")" = \
            "$(jq -r .compiled_batch.manifest_digest docs/evidence/topic-corpus-framework-baseline-v1.json)"

      - name: Validate Debate Core observation corpus
        run: |
          python3 -m unittest tools/test_debate_observation.py
          python3 tools/debate_observation.py validate \
            data/gates/debate-core/observation-corpus-v1.json

      - name: Validate User Argument Parsing gold corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools/test_user_argument_evaluation.py
          python3 tools/user_argument_evaluation.py validate
          python3 tools/user_argument_evaluation.py compile \
            --output "$RUNNER_TEMP/user-argument-gold-compiled.json"
          jq -e '
            .schema == "qxfx0.user-argument-gold-compiled.v1" and
            .authority_change == "none" and
            .persistence_change == "none" and
            .raw_user_logs == false and
            .reviewed_formulations_only == true and
            .parser_implementation == false and
            .runtime_integration == false and
            .cases_total == 17 and
            (.relation_coverage | length) == 9
          ' "$RUNNER_TEMP/user-argument-gold-compiled.json" >/dev/null
          test \
            "$(jq -r .manifest_digest "$RUNNER_TEMP/user-argument-gold-compiled.json")" = \
            "$(jq -r .manifest_digest docs/evidence/user-argument-gold-corpus-baseline-v1.json)"

      - name: Export release metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg version "$(target/release/qxfx0 version)" \
            '{schema:"qxfx0.release-metadata.v1",commit:$commit,ref:$ref,run_id:$run_id,version:$version}' \
            > "$RUNNER_TEMP/qxfx0-release-metadata.json"

      - name: Upload ResponsePlan V2 operational evidence
        uses: actions/upload-artifact@v7
        with:
          name: response-plan-v2-operational-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qxfx0-authority-trace.jsonl
            ${{ runner.temp }}/qxfx0-authority-verification.json
            ${{ runner.temp }}/qxfx0-authority-report.json
            ${{ runner.temp }}/qxfx0-release-metadata.json
            ${{ runner.temp }}/qxfx0-v2-gates/*.json
            ${{ runner.temp }}/qxfx0-v2-behavioral/**/*.jsonl
            ${{ runner.temp }}/qxfx0-v2-behavioral/*-report.json
          if-no-files-found: error
          retention-days: 90
