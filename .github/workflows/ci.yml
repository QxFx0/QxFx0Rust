name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Format + Clippy + Test + Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run all tests and targets
        run: cargo test --workspace --all-targets

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Run production health check
        run: target/release/qxfx0 --db "$RUNNER_TEMP/qxfx0-doctor.db" doctor

      - name: Run ResponsePlan V2 contract gates
        shell: bash
        run: |
          set -euo pipefail
          for gate in \
            response-plan-v2-phase-a \
            response-plan-v2-phase-b \
            response-plan-v2-phase-c \
            response-plan-v2-replay \
            response-plan-v2-zero-downgrade \
            response-plan-v2-canary-report; do
            target/release/qxfx0 doctor --gate "$gate"
          done

      - name: Verify explicit canary authority CLI path
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/qxfx0-authority-trace.jsonl"
          target/release/qxfx0 \
            --db "$RUNNER_TEMP/qxfx0-authority.db" \
            turn "что такое свобода?" \
            --response-plan-v2-authority \
            --response-plan-v2-trace-jsonl "$trace"
          test -s "$trace"
