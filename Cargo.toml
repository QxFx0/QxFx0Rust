[workspace]
resolver = "2"
members = [
    "qxfx0-types",
    "qxfx0-self",
    "qxfx0-semantic",
    "qxfx0-commitment",
    "qxfx0-morphology",
    "qxfx0-persistence",
    "qxfx0-governance",
    "qxfx0-guard",
    "qxfx0-render",
    "qxfx0-pipeline",
    "qxfx0-cli",
    "qxfx0-code",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["QxFx0 Contributors"]
license = "MIT"
repository = "https://github.com/QxFx0/QxFx0Rust"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
debug = 1
overflow-checks = true

[profile.production]
inherits = "release"
lto = "fat"
strip = "symbols"
incremental = false