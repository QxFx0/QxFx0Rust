[package]
name = "qxfx0-cli"
default-run = "qxfx0"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "qxfx0"
path = "src/main.rs"

[dependencies]
qxfx0-types = { path = "../qxfx0-types", version = "0.1.1" }
qxfx0-self = { path = "../qxfx0-self", version = "0.1.1" }
qxfx0-semantic = { path = "../qxfx0-semantic", version = "0.1.1" }
qxfx0-plan-v2 = { path = "../qxfx0-plan-v2", version = "0.1.1" }
qxfx0-commitment = { path = "../qxfx0-commitment", version = "0.1.1" }
qxfx0-morphology = { path = "../qxfx0-morphology", version = "0.1.1" }
qxfx0-persistence = { path = "../qxfx0-persistence", version = "0.1.1" }
qxfx0-gates = { path = "../qxfx0-gates", version = "0.1.1" }
qxfx0-codex = { path = "../qxfx0-codex", version = "0.1.1" }
qxfx0-serve = { path = "../qxfx0-serve", version = "0.1.1" }
qxfx0-self-v2 = { path = "../qxfx0-self-v2", version = "0.1.1" }
qxfx0-bridge = { path = "../qxfx0-bridge", version = "0.1.1" }
qxfx0-guard = { path = "../qxfx0-guard", version = "0.1.1" }
qxfx0-render = { path = "../qxfx0-render", version = "0.1.1" }
qxfx0-pipeline = { path = "../qxfx0-pipeline", version = "0.1.1" }
qxfx0-code = { path = "../qxfx0-code", version = "0.1.1" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
ctrlc = "3.4"

[dev-dependencies]
ed25519-dalek.workspace = true
rusqlite.workspace = true

[features]
default = []
# Forwarding feature: enabling it pulls in qxfx0-bridge's llm-candidates
# (transport present but still fail-closed) so `doctor` truthfully reports
# a build that has any network-capable code linked. The default build stays
# pure (no network surface at all).
llm-candidates = ["qxfx0-bridge/llm-candidates"]
